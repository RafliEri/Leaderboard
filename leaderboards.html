<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboards</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* 4 columns (age groups) x 2 rows (Boys top, Girls bottom) */
  .grid {
    display: grid; width: 100vw; height: 100vh; gap: 2px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    grid-auto-flow: column;
  }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #fs {
    position: fixed; right: 12px; bottom: 12px; z-index: 10;
    padding: 8px 14px; border: 0; border-radius: 6px;
    background: rgba(0,0,0,.7); color: #fff; font: 14px sans-serif; cursor: pointer;
    opacity: .3; transition: opacity .2s;
  }
  #fs:hover { opacity: 1; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<button id="fs">Fullscreen</button>
<script>

  const TOURNAMENTS = [
    "20005922-be21-44dd-9371-66523e27a66f", // RGC Junior Season Race II
  ];
  // 1-4 = Boys, 5-8 = Girls; paired so Boys fill the top row and Girls the bottom.
  const CATEGORIES = [1, 5, 2, 6, 3, 7, 4, 8];
  const LIVE_PLAY = true;

  const BASE = "https://tournament.lemiplay.app";
  const grid = document.getElementById("grid");
  for (const id of TOURNAMENTS) {
    for (const cat of CATEGORIES) {
      const frame = document.createElement("iframe");
      frame.src = `${BASE}/tournament-leaderboard/${id}#cat=${cat}&live=${LIVE_PLAY ? 1 : 0}`;
      grid.appendChild(frame);
    }
  }

  const btn = document.getElementById("fs");
  btn.onclick = () => document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen();
  document.addEventListener("fullscreenchange", () => {
    btn.style.display = document.fullscreenElement ? "none" : "";
  });
</script>
</body>
</html>
